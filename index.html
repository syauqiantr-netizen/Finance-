function doPost(e) {

  lock.waitLock(30000);

      log.appendRow(['Waktu', 'Layar', 'Item', 'Dari', 'Jadi', 'Perangkat']);
      log.setFrozenRows(1);
      log.setColumnWidth(1, 150);
      log.setColumnWidth(3, 260);

  } catch (err) {
    return keluar({ ok: false, pesan: String(err) });
  } finally {
    lock.releaseLock();
  }

function doGet(e) {

.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.ct{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lbl{font-size:13.5px}
.lbl small{display:block;color:var(--dim2);font-size:11px;margin-top:1px}
.val{font-size:14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--sh)}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.stat .v{font-size:20px;font-weight:750;margin-top:6px;letter-spacing:-.02em}
.stat .n{font-size:11px;color:var(--dim);margin-top:3px}
input.rp,input.txt{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:13px;
  color:var(--tx);padding:12px 13px;font-size:16px;outline:none;font-weight:650;font-family:inherit}
input.rp{text-align:right;font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
input.rp:focus,input.txt:focus{border-color:var(--ac);background:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;color:var(--dim);font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{background:var(--soft);border:1px solid transparent;color:var(--dim);border-radius:999px;
  padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.chip:active{transform:scale(.96)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:14px;
  padding:13px;font-size:14.5px;font-weight:750;cursor:pointer;color:#fff;font-family:inherit}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--soft);color:var(--dim)}
.brow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.brow:last-of-type{border-bottom:0}
.brow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm small{display:block;color:var(--dim2);font-size:11px}
.mini{width:98px;background:var(--soft);border:1.5px solid transparent;border-radius:10px;color:var(--tx);
  padding:9px;font-size:14px;text-align:right;outline:none;font-weight:650;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.mini:focus{border-color:var(--ac);background:#fff}
.inm{flex:1;min-width:0;background:var(--soft);border:1.5px solid transparent;border-radius:10px;
  color:var(--tx);padding:9px 10px;font-size:13.5px;outline:none;font-family:inherit;font-weight:550}
.inm:focus{border-color:var(--ac);background:#fff}
.icobtn{background:none;border:0;color:var(--dim2);padding:6px;cursor:pointer;display:flex;flex-shrink:0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 0;color:var(--dim2);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit}
.dot{width:5px;height:5px;border-radius:99px}
.mrow{display:flex;align-items:center;gap:13px;padding:15px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;cursor:pointer;width:100%;text-align:left;
  color:var(--tx);box-shadow:var(--sh);font-family:inherit}
.mrow .t{flex:1;font-size:14.5px;font-weight:650}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;color:var(--dim);
  font-size:12.5px;font-weight:700;padding:0;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:7px;padding:0 14px;margin-top:13px}
.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--sh)}
.scr{max-height:340px;overflow-y:auto;margin:0 -3px;padding:0 3px}
.note{font-size:11.5px;color:var(--dim2);line-height:1.55}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;background:#111826;color:#fff;
  border-radius:999px;padding:8px 16px;font-size:12px;font-weight:700;z-index:50;
  display:flex;gap:6px;align-items:center;box-shadow:0 8px 24px -8px rgba(17,24,38,.5)}
.tahap{margin-bottom:15px}
.tahap:last-child{margin-bottom:0}
.tahap h4{margin:0 0 7px;font-size:12.5px;font-weight:750;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.tahap h4 i{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.langkah{display:flex;gap:9px;padding:4px 0;font-size:12.5px;line-height:1.62;color:var(--dim)}
.langkah .n{flex:0 0 15px;color:var(--dim2);font-weight:700;font-size:11px;padding-top:2px;
  font-family:ui-monospace,Menlo,monospace}
.langkah b{color:var(--tx);font-weight:700}
textarea.js{width:100%;height:110px;background:var(--soft);border:1.5px solid transparent;border-radius:12px;
  padding:11px;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--dim);outline:none;resize:none}
